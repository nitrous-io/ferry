# Required
# command - command
description "ferry"
author      "root"

start on (filesystem and net-device-up)
stop on runlevel [!2345]

env DAEMON=/usr/sbin/ferry
env FERRY_PORT=65343

# Redirect stdout/stderr to /var/log/upstart/<job>.log
console log

# Automatically respawn.
respawn

# Respawn job up to 10 times within a 5 second period.
# If the job exceeds these values, it'll be stopped and marked as failed.
respawn limit 10 5

script
  echo $$ > /var/run/ferry.pid
  exec $DAEMON -p $FERRY_PORT
end script

pre-start script
  echo "[`date -u +%Y-%m-%dT%T.%3NZ`] (sys) Starting ferry" >> /var/log/ferry.log
end script

pre-stop script
  rm /var/run/ferry.pid
  echo "[`date -u +%Y-%m-%dT%T.%3NZ`] (sys) Stopping ferry" >> /var/log/ferry.log
end script
